<div class="custom-dialog-content">
  <div mat-dialog-content>
      <p style="color: black;">¿Desea {{action}} usuario: <b>{{username}}?</b></p>
  </div>
  <div mat-dialog-actions align="center">
      <button mat-raised-button (click)="onYesClick()" cdkFocusInitial class="actionBtn" color="primary">Sí</button>
      <button mat-raised-button (click)="onNoClick()" color="warn" class="closeBtn">No</button>
  </div>
</div>
