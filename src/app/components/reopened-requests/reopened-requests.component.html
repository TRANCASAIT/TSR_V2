<div class="container">
  <mat-card class="card">
      <mat-card-content>
          <mat-card-title class="text-center">Historial de Solicitudes Reabiertas</mat-card-title>
          <div class="container" [@bottomToTopAnimation]>
              <div class="row">
                <div class="col-12">
                  <mat-form-field class="mt-field-search" appearance="outline">
                      <mat-label>Buscar <mat-icon>search</mat-icon></mat-label>
                      <input matInput (keyup)="applyFilter($event)" placeholder="Ex. ium" #inputSearch>
                  </mat-form-field>
              </div>
              </div>
          </div>

          @if(spinner){
            <div class="spinner-container">
              <mat-spinner diameter="30" color="warn" class="spinner" ></mat-spinner>
            </div>
          }

          <div class="table-responsive" [hidden]="showTable">
              <table mat-table [dataSource]="dataSource">

                  <ng-container matColumnDef="service">
                      <th mat-header-cell *matHeaderCellDef> Servicio/Folio </th>
                      <td mat-cell *matCellDef="let element"> {{element.serviceRequestId}} </td>
                  </ng-container>

                  <ng-container matColumnDef="status">
                    <th mat-header-cell *matHeaderCellDef> Estatus actual </th>
                    <td mat-cell *matCellDef="let element"> {{element.status}} </td>
                </ng-container>

                  <ng-container matColumnDef="option">
                      <th mat-header-cell *matHeaderCellDef> Historial de cambios </th>
                      <td mat-cell *matCellDef="let element">
                          <mat-icon class="inactivo"
                              (click)="openDialog({type: 'edit', service:element.serviceRequestId})">update</mat-icon>
                      </td>
                  </ng-container>

                  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
              </table>
              <mat-paginator [hidden]="showTable" [pageSizeOptions]="[10, 25, 100, 1000]" [pageSize]="10"></mat-paginator>
          </div>
      </mat-card-content>
  </mat-card>
</div>
