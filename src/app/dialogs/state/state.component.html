<div class="custom-dialog-content" [@leftToRightAnimation]>
  <h1 mat-dialog-title class="text-center">Estado</h1>
  <div mat-dialog-content>
      <form [formGroup]="stateForm">
          <div class="text-center">
              <input matInput formControlName="stateId" [errorStateMatcher]="matcher" hidden>
              <div class="row">
                  <div class="col-sm-12">
                      <mat-form-field appearance="outline" class="mt-field">
                          <mat-label>Nombre</mat-label>
                          <input matInput placeholder="Estado" formControlName="stateName"
                              [errorStateMatcher]="matcher">
                          <mat-error> {{errorMsgFrm}}</mat-error>
                      </mat-form-field>
                  </div>
              </div>
              <div class="row">
                  <div class="col-sm-12">
                      <div *ngIf="spinner" id="logSpinner" class="text-center d-flex justify-content-end">
                          <mat-progress-spinner class="text-right" color="warn" [mode]="mode" [value]="value"
                              [diameter]="40">
                          </mat-progress-spinner>
                      </div>
                  </div>
              </div>
              <div class="row">
                  <div class="col-sm-6 top">
                      <button mat-raised-button mat-dialog-close color="primary">Cancelar</button>
                  </div>
                  <div class="col-sm-6 top">
                      <button [disabled]="stateForm.invalid" color="warn" mat-raised-button
                          (click)="registerUpdateObj(stateForm.value)">{{btnTxt}}</button>
                  </div>
              </div>
          </div>
      </form>
  </div>
</div>
