<div class="custom-dialog-content" [@leftToRightAnimation]>
  <h1 mat-dialog-title class="text-center">Solicitud de Servicio: {{serviceId}}</h1>
  <div mat-dialog-content>
    <div class="table-responsive">
      <table mat-table [dataSource]="dataSource">

        <ng-container matColumnDef="reason">
          <th mat-header-cell *matHeaderCellDef> Motivo </th>
          <td mat-cell *matCellDef="let element"> {{element.reason}} </td>
        </ng-container>

        <ng-container matColumnDef="lastModifiedBy">
          <th mat-header-cell *matHeaderCellDef>Modificado por  </th>
          <td mat-cell *matCellDef="let element"> {{element.lastModifiedBy}} </td>
        </ng-container>

        <ng-container matColumnDef="modifiedAt">
          <th mat-header-cell *matHeaderCellDef> Fecha de modificación </th>
          <td mat-cell *matCellDef="let element"> {{element.modifiedAt}} </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
      <mat-paginator [pageSizeOptions]="[5]" [pageSize]="5"></mat-paginator>
    </div>
  </div>
</div>
